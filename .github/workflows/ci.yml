name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate contracts and golden set
        run: wcs-validate-evals
      - name: Enforce evaluation regression gates
        run: wcs-check-regressions
      - name: Test
        run: pytest
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
