[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wcs-rag-evals"
version = "0.1.0"
description = "Evaluation-first RAG over public Warehouse Control System documentation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raphael Caveagna" }]
dependencies = [
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
wcs-fetch-corpus = "wcs_rag_evals.fetch_corpus:main"
wcs-validate-evals = "wcs_rag_evals.validate_dataset:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wcs_rag_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

